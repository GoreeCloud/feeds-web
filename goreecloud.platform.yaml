schema_version: "0.4"

component:
  type: application
  id: goreecloud-feeds-web
  product_name: GoreeCloud Feeds Web
  repository: GoreeCloud/feeds-web

lifecycle: planned
version: "0.1.0-planned"

supported_platforms:
  - web

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: [README.md, SPECIFICATIONS.md]
    notes: Accepted Manager application visibility, health/state, and administration integration are not implemented.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: [PRIVACY POLICY.md, SPECIFICATIONS.md]
    notes: Planned privacy requirements exist, but no runtime Privacy Shield integration or acceptance exists.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: [SECURITY.md, SPECIFICATIONS.md]
    notes: Planned security requirements exist, but no Wardveil Security runtime integration or acceptance exists.
  everkeep:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md, USER-MANUAL.md]
    notes: Server-side recovery is authoritative for durable product data; client-local recovery/cache behavior and accepted Everkeep-related boundaries are not implemented.
  glaze_ui:
    result: applicable-blocked
    version: "1.6.0"
    evidence: [README.md, BRANDING.md, FEATURE-ROADMAP.md]
    notes: Glaze UI V1.6.0 is the current Official Stable consumer target, but no Feeds Web implementation, rendered acceptance, accessibility acceptance, or product conformance exists.
  mesh:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: Mesh service discovery/transport/capability integration is not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md, SECURITY.md]
    notes: GoreeCloud Identity is the planned identity/authentication authority, but no accepted client integration exists.
  policy:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: GoreeCloud Policy decision provenance, freshness, exception, explanation, and enforcement coordination are not established.
  observability:
    result: applicable-blocked
    version: null
    evidence: [SPECIFICATIONS.md]
    notes: No accepted GoreeCloud Observability metrics, events, diagnostics, dependency-health, provenance, or alerting integration exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - Treat browser-local cache as non-authoritative unless a later approved design explicitly promotes local durable state.
  restore:
    required: false
    requirements:
      - Recover durable product state from the authoritative server rather than relying on browser-local cache where possible.
  export:
    required: true
    requirements:
      - Expose user-requested portable export through supported server contracts without leaking reusable credentials.
  portability:
    required: true
    requirements:
      - Keep client-visible durable state compatible with versioned GoreeCloud Feeds protocol contracts.

external_dependencies: []

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: "1.6.0"
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: [README.md, SPECIFICATIONS.md, FEATURES.md, BRANDING.md, SECURITY.md, PRIVACY POLICY.md]
  blockers:
    - No web application, build system, browser bundle, server connection, offline runtime, or deployment exists.
    - Glaze UI V1.6.0 application-specific implementation and acceptance are not established.
    - GoreeCloud Identity integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Client-local recovery/cache acceptance is not established.
    - GoreeCloud Manager integration and acceptance are not established.
    - GoreeCloud Mesh integration and acceptance are not established.
    - GoreeCloud Policy integration and acceptance are not established.
    - GoreeCloud Observability integration and acceptance are not established.
    - Responsive, accessibility, performance, browser, deployment, rollback, release, and Stable qualification do not exist.
